name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Read tree-sitter CLI pin
        id: tree-sitter-pin
        shell: bash
        run: node -p '"ref=v" + require("./package.json").devDependencies["tree-sitter-cli"]' >> "$GITHUB_OUTPUT"
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ steps.tree-sitter-pin.outputs.ref }}
      - name: Verify generated sources
        shell: bash
        run: |
          abi=$(cat ci/tree-sitter-abi.txt)
          tree-sitter generate --abi "$abi" --js-runtime native
          awk '
            /^static bool ts_lex\(/ { in_main_lexer = 1 }
            /^}/ { in_main_lexer = 0 }
            in_main_lexer && /^[[:space:]]*case [0-9]+:/ { cases++ }
            /^[[:space:]]*#[[:space:]]*pragma[[:space:]]+(optimize[[:space:]]*\(|clang[[:space:]]+optimize[[:space:]]+off([[:space:]]|$)|GCC[[:space:]]+optimize([[:space:](]|$))/ {
              print FILENAME ":" FNR ": forbidden optimization pragma: " $0
              blocked = 1
            }
            END { print "Main lexer cases: " (cases + 0); exit (blocked || !cases) }
          ' src/parser.c
          parser_abi=$(sed -n 's/^#define LANGUAGE_VERSION //p' src/parser.c)
          if [ "$parser_abi" != "$abi" ]; then
            echo "::error::src/parser.c LANGUAGE_VERSION $parser_abi differs from ci/tree-sitter-abi.txt $abi"
            exit 1
          fi
          git diff --exit-code -- src
          # git diff misses generated files that are not in the checkout.
          status=$(git status --porcelain --untracked-files=all -- src)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "::error::Generated sources differ from the checkout"
            exit 1
          fi
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/bindings/python/tests/requirements.txt
        with:
          generate: false
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          go-version: "1.23.x"
          test-swift: true

  fuzz:
    name: Fuzz parser corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Read tree-sitter CLI pin
        id: tree-sitter-pin
        shell: bash
        run: node -p '"ref=v" + require("./package.json").devDependencies["tree-sitter-cli"]' >> "$GITHUB_OUTPUT"
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ steps.tree-sitter-pin.outputs.ref }}
      - name: Fuzz corpus
        shell: bash
        env:
          TREE_SITTER_LIBDIR: ${{ runner.temp }}/fuzz-lib
          TREE_SITTER_LOG_SEED: '1'
        run: |
          log="$RUNNER_TEMP/fuzz.log"
          timeout --kill-after=10s 120s tree-sitter fuzz --edits 3 --iterations 10 2>&1 | tee "$log"
          # CLI 0.27.2 logs corpus failures without returning a nonzero status.
          if grep -Eq '^[1-9][0-9]* java corpus tests failed fuzzing$' "$log"; then
            echo "::error::Corpus fuzzing failed (see case and seed above)"
            exit 1
          fi
          if ! grep -Eq '^  [0-9]+\. java - ' "$log"; then
            echo "::error::No Java corpus cases ran"
            exit 1
          fi

  parser-cost:
    name: Check parser cost
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      - run: node scripts/parser-cost.mjs --check

  examples:
    name: Parse examples
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Read tree-sitter CLI pin
        id: tree-sitter-pin
        shell: bash
        run: node -p '"ref=v" + require("./package.json").devDependencies["tree-sitter-cli"]' >> "$GITHUB_OUTPUT"
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ steps.tree-sitter-pin.outputs.ref }}
      # Pinned heads of the default branches, taken 2026-11-19. To move a pin,
      # change the SHA, run this job, update test/examples/failures.txt and regenerate the verdicts.
      - name: Set up examples
        shell: bash
        run: |
          fetch() {
            git init -q "examples/$1"
            git -C "examples/$1" fetch -q --depth=1 --filter=blob:none "https://github.com/$2" "$3"
            git -C "examples/$1" checkout -q --detach FETCH_HEAD
          }
          fetch elasticsearch elastic/elasticsearch fad3d94329d6857092b576a393795d8aa619aff2
          fetch guava google/guava 1dfc2cbc4c3db95d135525aee1d4243c966fdb7e
          fetch RxJava ReactiveX/RxJava ca68c460f34b4591cec3a69ba67872f5040ef346
          fetch flink apache/flink cc91df476a0b39ae7d6eb50eb8cf96f1dbad2b47
          fetch log4j2 apache/logging-log4j2 572cd83040450763a673ea749ad0c960563eeec9
          fetch cassandra apache/cassandra 53c3561e9db3fa0b1ed8e29ce462fde6ce566ff0
          # OpenJDK sources (GPLv2 + Classpath Exception) are fetched at run time and never committed.
          git init -q examples/jdk
          git -C examples/jdk remote add origin https://github.com/openjdk/jdk25u
          git -C examples/jdk fetch -q --no-tags --depth=1 --filter=blob:none origin fda231468e56663992785ec199a6efb8eca3cc7a
          printf '%s\n' '/src/**/*.java' '/test/langtools/tools/javac/**/*.java' |
            git -C examples/jdk sparse-checkout set --no-cone --stdin
          git -C examples/jdk checkout -q --detach FETCH_HEAD
          # A file lost from the checkout would drop out of the inputs and the failures alike, so compare the
          # checked-out .java files with the pinned tree.
          git -C examples/jdk ls-tree -r -z --name-only HEAD -- src test/langtools/tools/javac |
            grep -z '\.java$' | LC_ALL=C sort -z > "$RUNNER_TEMP/jdk-tree.txt"
          (cd examples/jdk && find src test/langtools/tools/javac -type f -name '*.java' -print0) |
            LC_ALL=C sort -z > "$RUNNER_TEMP/jdk-disk.txt"
          cmp -s "$RUNNER_TEMP/jdk-tree.txt" "$RUNNER_TEMP/jdk-disk.txt" ||
            { echo "::error::The OpenJDK checkout does not hold exactly the pinned .java files"; exit 1; }
      # The CLI exits 1 for syntax errors and for read errors alike, so the exit code
      # cannot tell a complete run from an aborted one. Only a final summary that lists
      # exactly the inputs counts as complete; anything else fails the job here.
      - name: Parse examples
        id: examples
        shell: bash
        run: |
          find examples -type f -name '*.java' | LC_ALL=C sort > "$RUNNER_TEMP/inputs.txt"
          test -s "$RUNNER_TEMP/inputs.txt" || { echo "::error::No example inputs found"; exit 1; }
          status=0
          tree-sitter parse -q --paths "$RUNNER_TEMP/inputs.txt" --json-summary > "$RUNNER_TEMP/stdout.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::tree-sitter parse crashed (exit $status)"
            exit 1
          fi
          # stdout: the error lines, then the JSON summary that starts at a line holding only "{".
          sed -n '/^{$/,$p' "$RUNNER_TEMP/stdout.txt" > "$RUNNER_TEMP/summary.json"
          if ! jq -r '.parse_summaries[].file' "$RUNNER_TEMP/summary.json" | LC_ALL=C sort > "$RUNNER_TEMP/parsed.txt" \
            || ! cmp -s "$RUNNER_TEMP/inputs.txt" "$RUNNER_TEMP/parsed.txt"; then
            echo "::error::Incomplete parse: the summary is missing or does not list exactly the $(wc -l < "$RUNNER_TEMP/inputs.txt") inputs (tree-sitter exit $status)"
            exit 1
          fi
          jq -r '.parse_summaries[] | select(.successful | not) | .file' "$RUNNER_TEMP/summary.json" | LC_ALL=C sort > "$RUNNER_TEMP/failures.txt"
          echo "Parsed $(wc -l < "$RUNNER_TEMP/parsed.txt") files, $(wc -l < "$RUNNER_TEMP/failures.txt") failed"
          delimiter="EOF_$RANDOM$RANDOM$RANDOM"
          { echo "failures<<$delimiter"; cat "$RUNNER_TEMP/failures.txt"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: Failures equal test/examples/failures.txt
        shell: bash
        # "<" is a baseline entry that now parses, ">" is a new failure.
        run: diff -u test/examples/failures.txt "$RUNNER_TEMP/failures.txt"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      - name: Check example failure verdicts
        run: node scripts/example-verdicts.mjs --check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.examples.outputs.failures != '' }}
        with:
          name: failures
          # The list only: the example sources stay with their own licences (OpenJDK: GPLv2 + Classpath Exception).
          path: ${{ runner.temp }}/failures.txt

  oracle-replay:
    name: Oracle replay
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Replay the javac oracle
        run: node scripts/oracle-replay.mjs
      - name: Check the node kind snapshot
        run: node scripts/generate-node-kinds.mjs --check
      - name: Check the node types contract
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          node scripts/check-node-types.mjs --self-test
          node scripts/check-node-types.mjs "$BASE"
      - name: Set up Temurin 25.0.5+8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8
      - name: Check the structural oracle
        run: |
          node scripts/structural-compare.mjs --self-test
          node scripts/structural-compare.mjs --check

  oracle-javac:
    name: javac verdicts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Temurin 25.0.5+8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8
      - name: Run the runner self-test
        run: |
          mkdir "$RUNNER_TEMP/empty"
          java -cp "$RUNNER_TEMP/empty" oracle/runner/ParseOracle.java --self-test
      - name: Regenerate every verdict file
        shell: bash
        run: |
          for cases in oracle/data/cases/*.jsonl; do
            java -cp "$RUNNER_TEMP/empty" oracle/runner/ParseOracle.java --cases "$cases" \
              --out "oracle/data/verdicts/temurin-25.0.5+8.$(basename "$cases" .jsonl).json"
          done
      - name: Verdicts equal the committed files
        shell: bash
        run: |
          git status --short -- oracle/data/verdicts
          test -z "$(git status --porcelain -- oracle/data/verdicts)"
